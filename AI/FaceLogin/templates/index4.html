<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        #video_feed {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        #login_success {
            display: none;
            color: green;
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Face Recognition Login</h1>
        <img id="video_feed" src="{{ url_for('video_feed') }}" alt="Video Feed">
        <div id="login_success"></div>
    </div>

    <script>
        function checkLoginStatus() {
            fetch('/login_status')
                .then(response => response.json())
                .then(data => {
                    if (data.login_complete) {
                        document.getElementById('video_feed').style.display = 'none';
                        document.getElementById('login_success').style.display = 'block';
                        document.getElementById('login_success').textContent = `登录成功！欢迎, ${data.user}`;
                    } else {
                        setTimeout(checkLoginStatus, 1000);
                    }
                });
        }

        checkLoginStatus();
    </script>
</body>
</html>
